{% load static %}

<header id="site-header" class="site-header fixed inset-x-0 top-0 z-[var(--z-header)]" data-header>
  <div class="site-header-shell" data-nav-bar>
    <div class="site-header-inner mx-auto flex max-w-[var(--shell-max)] items-center justify-between gap-4 px-[var(--space-gutter)] py-2.5 lg:py-3">
      <a href="{% url 'core:home' %}" class="group shrink-0" aria-label="{{ SITE_NAME }}">
        <img
          src="{% static 'images/brand/logo-signature.webp' %}"
          srcset="{% static 'images/brand/logo-signature.webp' %} 1600w, {% static 'images/brand/logo-signature-4k.webp' %} 3200w"
          sizes="10rem"
          alt="{{ SITE_NAME }}"
          class="logo-mark site-header-logo"
          width="1600"
          height="982"
          decoding="async"
        >
      </a>

      <nav
        class="site-nav-primary hidden items-center lg:flex"
        aria-label="منوی اصلی"
      >
        <a href="{% url 'core:home' %}#services" class="nav-link">خدمات</a>
        <a href="{% url 'core:home' %}#gallery" class="nav-link">گالری</a>
        <a href="{% url 'magazine:hub' %}" class="nav-link">مجله</a>
        <a href="{% url 'consultations:hub' %}" class="nav-link">مشاوره</a>
      </nav>

      <div class="flex items-center gap-3 sm:gap-4">
        <a
          href="{% url 'appointments:create' %}"
          class="btn-draw header-cta hidden items-center gap-2 sm:inline-flex"
        >
          <span class="btn-draw-border" aria-hidden="true">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
              <rect x="0.5" y="0.5" width="99" height="99" pathLength="100"/>
            </svg>
          </span>
          <span class="btn-draw-label relative z-10">رزرو نوبت</span>
          <span class="btn-draw-label relative z-10" aria-hidden="true">←</span>
        </a>
        <button
          type="button"
          class="nav-toggle lg:hidden"
          data-nav-toggle
          aria-expanded="false"
          aria-controls="mobile-nav"
          aria-label="باز کردن منو"
        >
          <span class="nav-toggle-bars" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <div class="mobile-nav-backdrop" data-mobile-backdrop hidden aria-hidden="true"></div>

  <nav
    id="mobile-nav"
    class="mobile-nav"
    data-mobile-nav
    aria-label="منوی موبایل"
    hidden
  >
    <div class="mobile-nav-inner">
      <p class="mobile-nav-label">منو</p>
      <div class="mobile-nav-links">
        <a href="{% url 'core:home' %}#services" class="nav-link">خدمات</a>
        <a href="{% url 'core:home' %}#gallery" class="nav-link">گالری</a>
        <a href="{% url 'magazine:hub' %}" class="nav-link">مجله</a>
        <a href="{% url 'consultations:hub' %}" class="nav-link">مشاوره</a>
        <a href="{% url 'core:home' %}#contact" class="nav-link">تماس</a>
      </div>
      <div class="mobile-nav-actions">
        <a href="{% url 'appointments:create' %}" class="btn-draw mobile-nav-cta">
          <span class="btn-draw-border" aria-hidden="true">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
              <rect x="0.5" y="0.5" width="99" height="99" pathLength="100"/>
            </svg>
          </span>
          <span class="btn-draw-label relative z-10">رزرو نوبت</span>
          <span class="btn-draw-label relative z-10" aria-hidden="true">←</span>
        </a>
      </div>
    </div>
  </nav>
</header>

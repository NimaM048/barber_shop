{% extends "layouts/base.html" %}

{% block title %}ثبت‌نام | {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-20 sm:py-28">
  <p class="section-label">Account</p>
  <h1 class="mt-4 font-display text-4xl font-normal tracking-tight text-ivory">ثبت‌نام</h1>
  <p class="mt-3 text-sm font-light leading-relaxed text-ivory/45">
    حساب مشتری بسازید و نوبت رزرو کنید.
  </p>

  {% if error %}
  <p class="mt-6 border border-red-400/30 bg-red-950/40 px-4 py-3 text-sm text-red-100" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" class="mt-10 space-y-5" novalidate>
    {% csrf_token %}
    <div class="grid gap-5 sm:grid-cols-2">
      <div>
        <label for="first_name" class="mb-2 block text-xs font-light tracking-wide text-ivory/55">نام</label>
        <input id="first_name" name="first_name" autocomplete="given-name" class="field-court">
      </div>
      <div>
        <label for="last_name" class="mb-2 block text-xs font-light tracking-wide text-ivory/55">نام خانوادگی</label>
        <input id="last_name" name="last_name" autocomplete="family-name" class="field-court">
      </div>
    </div>
    <div>
      <label for="username" class="mb-2 block text-xs font-light tracking-wide text-ivory/55">نام کاربری</label>
      <input id="username" name="username" required autocomplete="username" class="field-court">
    </div>
    <div>
      <label for="phone" class="mb-2 block text-xs font-light tracking-wide text-ivory/55">موبایل</label>
      <input id="phone" name="phone" inputmode="tel" dir="ltr" autocomplete="tel" class="field-court text-left" placeholder="0913xxxxxxx">
    </div>
    <div>
      <label for="password" class="mb-2 block text-xs font-light tracking-wide text-ivory/55">رمز عبور</label>
      <input id="password" type="password" name="password" required autocomplete="new-password" class="field-court">
    </div>
    <button type="submit" class="btn-court-fill w-full">ایجاد حساب</button>
  </form>

  <p class="mt-8 text-center text-sm font-light text-ivory/40">
    حساب دارید؟
    <a href="{% url 'accounts:login' %}" class="text-ivory/75 transition hover:text-ivory">ورود</a>
  </p>
</section>
{% endblock %}

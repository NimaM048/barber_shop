{% extends "layouts/base.html" %}

{% block title %}ثبت‌نام | {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-16">
  <h1 class="text-2xl font-bold text-stone-900">ثبت‌نام</h1>
  <p class="mt-2 text-sm text-stone-600">حساب مشتری بسازید و نوبت رزرو کنید.</p>

  {% if error %}
  <p class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" class="mt-8 space-y-4" novalidate>
    {% csrf_token %}
    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label for="first_name" class="mb-1 block text-sm font-medium text-stone-700">نام</label>
        <input id="first_name" name="first_name"
               class="w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-700/20">
      </div>
      <div>
        <label for="last_name" class="mb-1 block text-sm font-medium text-stone-700">نام خانوادگی</label>
        <input id="last_name" name="last_name"
               class="w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-700/20">
      </div>
    </div>
    <div>
      <label for="username" class="mb-1 block text-sm font-medium text-stone-700">نام کاربری</label>
      <input id="username" name="username" required
             class="w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-700/20">
    </div>
    <div>
      <label for="phone" class="mb-1 block text-sm font-medium text-stone-700">موبایل</label>
      <input id="phone" name="phone" inputmode="tel"
             class="w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-700/20">
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-stone-700">رمز عبور</label>
      <input id="password" type="password" name="password" required
             class="w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 outline-none focus:border-amber-700 focus:ring-2 focus:ring-amber-700/20">
    </div>
    <button type="submit" class="w-full rounded-xl bg-amber-800 px-4 py-3 text-sm font-semibold text-white transition hover:bg-amber-900">
      ایجاد حساب
    </button>
  </form>
</section>
{% endblock %}
